name: github pages

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.10.3'
          cabal-version: '3.16.1.0'

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: cabal-${{ runner.os }}-

      - name: Build
        run: cabal run homepage -- build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site

      - name: Wait for Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deployed=$(gh api "repos/${{ github.repository }}/git/ref/heads/gh-pages" --jq .object.sha)
          for _ in $(seq 1 60); do
            read -r commit status < <(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '"\(.commit) \(.status)"')
            echo "pages build: $commit $status (want $deployed)"
            if [ "$commit" = "$deployed" ]; then
              case "$status" in
                built) exit 0 ;;
                errored) exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo "timed out waiting for Pages build" >&2
          exit 1

      - name: Purge Cloudflare cache
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
