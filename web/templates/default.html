<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; img-src 'self'; base-uri 'self'; form-action 'none'" />
    <meta name="description" content="Tricking silicon into thinking" />
    <title>$title$ &ndash; t4ccer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css" integrity="sha512-IW0nhlW5MgNydsXJO40En2EoCkTTjZhI3yuODrZIc8cQ4h1XcF53PsqDHa09NqnkXuIe0Oiyyj171BqZFwISBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <div class="page">
      <header class="page__header">
        <nav class="nav">
          <h1 class="logo"><a href="/">t4ccer</a></h1>
          <a$if(onPosts)$ class="active"$endif$ href="/posts/">./Posts</a>
          <a$if(onPosts)$$else$ class="active"$endif$ href="/">./About</a>
        </nav>
      </header>

      <main class="page__body">
        $body$
      </main>

      <aside class="page__aside">
        <h1 class="aside__title">t4ccer</h1>
        <p class="aside__description">Tricking silicon into thinking</p>
        <div class="aside__social">
          $social$
        </div>
        $if(date)$
        <hr />
        <p class="aside__date">$date$</p>
        $endif$
      </aside>

      <footer class="page__footer">
        <p>Powered by <a href="https://jaspervdj.be/hakyll/" target="_blank">Hakyll</a>. Theme based on <a href="https://github.com/joeroe/risotto" target="_blank">risotto</a>.</p>
      </footer>
    </div>
  </body>
</html>
